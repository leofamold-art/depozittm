<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд на настройке</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="maintenance">
        <section class="maintenance-panel" aria-live="polite">
            <div class="loader" aria-hidden="true"></div>
            <h1>Дашборд временно на настройке</h1>
            <p>Мы обновляем структуру данных и лист настроек. Скоро вернём дашборд с корректными показателями.</p>
            <div class="maintenance-status">
                <span class="status-dot"></span>
                <span>Подготовка данных</span>
            </div>
            <time id="current-date"></time>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
